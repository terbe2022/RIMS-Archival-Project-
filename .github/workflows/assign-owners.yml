name: Assign issue owners

# Sets GitHub assignees on every issue. Run by hand from the Actions tab.
# Safe to re-run — assignees are replaced, not stacked.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type ASSIGN to confirm.'
        required: true
        default: ''

permissions:
  issues: write

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        if: ${{ github.event.inputs.confirm != 'ASSIGN' }}
        run: |
          echo "::error::Type ASSIGN in the confirm box to run this."
          exit 1

      - name: Assign
        env:
          GH_TOKEN: ${{ github.token }}
          TAYLER: terbe2022
          GAURI: gauri-bhasin
        run: |
          assign() {          # assign <issue> <user...>
            n=$1; shift
            args=""
            for u in "$@"; do args="$args --add-assignee $u"; done
            gh issue edit "$n" --repo "$GITHUB_REPOSITORY" $args >/dev/null
            echo "  #$n -> $*"
          }

          echo "Gauri — build and evaluation work"
          for n in 4 5 6 7 8 13 14 15 16 18 19 20; do assign $n "$GAURI"; done

          echo "Tayler — access, stakeholders, infrastructure"
          for n in 2 9 10 11 12 17 21 23; do assign $n "$TAYLER"; done

          echo "Both — shared decisions"
          for n in 1 3 22; do assign $n "$TAYLER" "$GAURI"; done

      - name: Summary
        run: |
          {
            echo "## Assignees set"
            echo ""
            echo "| Who | Issues | Count |"
            echo "|---|---|---|"
            echo "| Gauri | #4–#8, #13–#16, #18–#20 | 12 |"
            echo "| Tayler | #2, #9–#12, #17, #21, #23 | 8 |"
            echo "| Both | #1, #3, #22 | 3 |"
            echo ""
            echo "Joanne, Brent and Bethany are tracked by the \`needs:\` labels"
            echo "and the Owner line in each issue body — no GitHub account required."
            echo ""
            echo "Gauri's queue: https://github.com/$GITHUB_REPOSITORY/issues/assigned/gauri-bhasin"
          } >> $GITHUB_STEP_SUMMARY
