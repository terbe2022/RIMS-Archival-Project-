<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accession Workbench — RIMS Backlog Processing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Accession Workbench — design tokens
   Palette: blueprint slate + shelf ochre + stamp red.
   Type: Archivo (interface chrome), Source Serif 4 (machine-written
   prose, so generated text always reads differently from UI text),
   IBM Plex Mono (paths, accession numbers, hashes only).
   ============================================================ */
:root{
  --paper:#E9ECEE;
  --paper-2:#DFE4E7;
  --surface:#FFFFFF;
  --ink:#15222B;
  --ink-2:#3C4A54;
  --ink-3:#6B7A85;
  --rule:#C3CCD2;
  --rule-2:#D9E0E4;
  --signal:#17527D;
  --signal-soft:#E4EDF4;
  --keep:#1B6144;
  --keep-soft:#E2EFE9;
  --archive:#8A6420;
  --archive-soft:#F6EDDC;
  --drop:#9E2B22;
  --drop-soft:#F8E5E2;
  --flag:#9E2B22;
  --focus:#B8862A;
  --sans:"Archivo","Helvetica Neue",Arial,sans-serif;
  --serif:"Source Serif 4",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --rail-w:250px;
  --shadow:0 1px 0 rgba(21,34,43,.06), 0 8px 24px -18px rgba(21,34,43,.5);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:14px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--signal)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- layout ---------- */
.app{display:flex;min-height:100vh}
.rail{
  width:var(--rail-w);flex:0 0 var(--rail-w);
  background:var(--ink);color:#DCE4E9;
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
}
.brand{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.brand h1{font-size:15px;font-weight:600;margin:0;letter-spacing:-.01em;color:#fff}
.brand p{margin:3px 0 0;font-size:11.5px;color:#8FA3AF;letter-spacing:.01em}
.nav{padding:10px 8px;flex:1;overflow:auto}
.nav-group{margin:0 0 14px}
.nav-group > span{display:block;padding:6px 10px 4px;font-size:11px;color:#78909C;letter-spacing:.02em}
.nav button{
  display:flex;align-items:baseline;gap:8px;width:100%;
  background:none;border:0;border-radius:3px;
  padding:7px 10px;text-align:left;color:#C9D5DC;cursor:pointer;font-size:13.5px;
}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button[aria-current="true"]{background:var(--signal);color:#fff;font-weight:500}
.nav button .n{margin-left:auto;font-family:var(--mono);font-size:11px;opacity:.75}
.rail-foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.1);font-size:11.5px;color:#8FA3AF}
.rail-foot strong{display:block;color:#fff;font-weight:500;font-size:12.5px;margin-bottom:2px}
.rail-foot .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#5FB98A;margin-right:6px;vertical-align:1px}

main{flex:1;min-width:0}
.topbar{
  display:flex;align-items:flex-end;gap:16px;
  padding:22px 28px 14px;border-bottom:1px solid var(--rule);
  background:var(--paper);position:sticky;top:0;z-index:20;
}
.topbar h2{margin:0;font-size:22px;font-weight:600;letter-spacing:-.02em}
.topbar p{margin:2px 0 0;color:var(--ink-3);font-size:13px;max-width:62ch}
.topbar .spacer{flex:1}
.view{padding:24px 28px 64px;max-width:1440px}
.hidden{display:none!important}

/* ---------- primitives ---------- */
.btn{
  white-space:nowrap;border:1px solid var(--rule);background:var(--surface);
  padding:7px 13px;border-radius:3px;cursor:pointer;font-size:13px;font-weight:500;
}
.btn:hover{border-color:var(--ink-3)}
.btn-primary{background:var(--signal);border-color:var(--signal);color:#fff}
.btn-primary:hover{background:#123F60;border-color:#123F60}
.btn-ghost{background:none;border-color:transparent;color:var(--signal)}
.btn-ghost:hover{background:var(--signal-soft);border-color:transparent}
.btn-sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:4px;box-shadow:var(--shadow)}
.panel-h{padding:13px 16px;border-bottom:1px solid var(--rule-2);display:flex;align-items:center;gap:10px}
.panel-h h3{margin:0;font-size:14px;font-weight:600}
.panel-h .spacer{flex:1}
.panel-b{padding:16px}
.tag{
  display:inline-flex;align-items:center;gap:5px;
  border-radius:2px;padding:2px 7px;font-size:11.5px;font-weight:500;
  border:1px solid transparent;white-space:nowrap;
}
.t-keep{background:var(--keep-soft);color:var(--keep);border-color:#BCD9CB}
.t-arch{background:var(--archive-soft);color:var(--archive);border-color:#E4D2AC}
.t-drop{background:var(--drop-soft);color:var(--drop);border-color:#EFC6C0}
.t-sig{background:var(--signal-soft);color:var(--signal);border-color:#BFD5E5}
.t-mute{background:var(--paper-2);color:var(--ink-2);border-color:var(--rule)}
.t-flag{background:#fff;color:var(--flag);border-color:var(--flag)}
.mono{font-family:var(--mono);font-size:12px}
.gen{font-family:var(--serif);font-size:14.5px;line-height:1.55}
.muted{color:var(--ink-3)}
.field{margin-bottom:16px}
.field > label{display:block;font-size:12.5px;font-weight:600;margin-bottom:4px}
.field .help{font-size:12px;color:var(--ink-3);margin:0 0 6px;max-width:70ch}
.field input[type=text],.field input[type=url],.field input[type=number],.field select,.field textarea{
  width:100%;padding:8px 10px;border:1px solid var(--rule);border-radius:3px;background:var(--surface);
}
.field textarea{min-height:86px;resize:vertical;font-family:var(--serif);font-size:14px;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--signal);outline:none;box-shadow:0 0 0 3px var(--signal-soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{
  display:flex;align-items:center;gap:7px;border:1px solid var(--rule);border-radius:3px;
  padding:7px 11px;background:var(--surface);cursor:pointer;font-size:13px;
}
.checks input{accent-color:var(--signal)}
.checks label:has(input:checked){border-color:var(--signal);background:var(--signal-soft);color:var(--signal);font-weight:500}

/* ---------- dashboard: the shelf ---------- */
.shelf{
  display:grid;grid-template-columns:1fr 34px 1fr 34px 1fr;align-items:stretch;gap:0;
  background:var(--surface);border:1px solid var(--rule);border-radius:4px;box-shadow:var(--shadow);
  overflow:hidden;
}
.bin{padding:18px 18px 16px;position:relative}
.bin + .arrow{display:flex;align-items:center;justify-content:center;color:var(--ink-3);background:var(--paper-2);font-size:16px}
.bin h4{margin:0;font-size:13px;font-weight:600}
.bin .path{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin:3px 0 12px;word-break:break-all}
.bin .count{font-size:38px;font-weight:600;letter-spacing:-.03em;line-height:1;font-feature-settings:"tnum"}
.bin .count small{font-size:13px;font-weight:400;color:var(--ink-3);letter-spacing:0;margin-left:6px}
.bin .stack{display:flex;gap:2px;margin-top:12px;height:38px;align-items:flex-end}
.bin .stack i{flex:1;background:var(--paper-2);border-top:2px solid var(--rule);display:block}
.bin.b-in .stack i{background:var(--signal-soft);border-top-color:var(--signal)}
.bin.b-orig .stack i{background:var(--archive-soft);border-top-color:var(--archive)}
.bin.b-out .stack i{background:var(--keep-soft);border-top-color:var(--keep)}
.bin .note{font-size:12px;color:var(--ink-3);margin-top:10px;font-family:var(--serif);line-height:1.4}

.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:16px}
.stat{background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:14px 16px}
.stat .k{font-size:12px;color:var(--ink-3)}
.stat .v{font-size:26px;font-weight:600;letter-spacing:-.02em;font-feature-settings:"tnum";margin-top:2px}
.stat .sub{font-size:12px;color:var(--ink-3);margin-top:2px}
.bar{height:6px;background:var(--paper-2);border-radius:2px;overflow:hidden;margin-top:9px;display:flex}
.bar i{display:block;height:100%}

.window-card{display:flex;gap:0;align-items:stretch;overflow:hidden}
.window-card .when{padding:16px 18px;border-right:1px solid var(--rule-2);min-width:210px}
.window-card .when .cd{font-size:30px;font-weight:600;letter-spacing:-.02em;font-feature-settings:"tnum"}
.window-card .load{padding:16px 18px;flex:1}

/* ---------- tables / ledger ---------- */
.ledger{width:100%;border-collapse:collapse;font-size:13px}
.ledger.fixed{table-layout:fixed}
.ledger th{
  text-align:left;font-size:11.5px;font-weight:600;color:var(--ink-2);
  padding:9px 10px;border-bottom:1px solid var(--rule);background:var(--paper);
  position:sticky;top:0;z-index:2;white-space:nowrap;
}
.ledger td{padding:9px 10px;border-bottom:1px solid var(--rule-2);vertical-align:top}
.ledger tbody tr:hover{background:#F6F9FA}
.ledger tbody tr.sel{background:var(--signal-soft)}
.ledger .rsnip{display:block;font-size:12.5px;color:var(--ink-3);margin-top:3px;max-width:62ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rtitle{font-weight:600;font-size:13.5px;cursor:pointer;display:block;text-align:left;background:none;border:0;padding:0;color:var(--ink)}
.ledger .rtitle:hover{color:var(--signal);text-decoration:underline}
.ledger .fname{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-top:3px;display:block;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ledger .why{font-family:var(--serif);font-size:13.5px;color:var(--ink-2);line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ledger .rtitle{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ledger td.num{font-feature-settings:"tnum";white-space:nowrap}
.kind{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.kind b{width:20px;height:20px;border-radius:2px;display:grid;place-items:center;font-size:10px;font-weight:600;color:#fff;font-family:var(--sans)}
.k-image b{background:#2F6E8F}.k-email b{background:#6A5AA8}.k-document b{background:#4E6A58}.k-media b{background:#8A6420}
.imp{display:flex;align-items:center;gap:7px}
.imp .pip{display:flex;gap:2px}
.imp .pip i{width:5px;height:14px;background:var(--paper-2);display:block;border-radius:1px}
.imp.high .pip i:nth-child(-n+3){background:var(--drop)}
.imp.medium .pip i:nth-child(-n+2){background:var(--archive)}
.imp.low .pip i:nth-child(-n+1){background:var(--ink-3)}
.conf{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.dispo{display:flex;gap:4px}
.dispo button{
  width:30px;height:28px;border:1px solid var(--rule);background:var(--surface);
  border-radius:3px;cursor:pointer;display:grid;place-items:center;color:var(--ink-3);
}
.dispo button:hover{border-color:var(--ink-2);color:var(--ink)}
.dispo button.on[data-d=keep]{background:var(--keep);border-color:var(--keep);color:#fff}
.dispo button.on[data-d=archive]{background:var(--archive);border-color:var(--archive);color:#fff}
.dispo button.on[data-d=delete]{background:var(--drop);border-color:var(--drop);color:#fff}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--rule-2);background:var(--paper)}
.toolbar select,.toolbar input[type=search]{padding:6px 9px;border:1px solid var(--rule);border-radius:3px;background:var(--surface);font-size:13px}
.toolbar input[type=search]{min-width:230px}
.seg{display:flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 11px;cursor:pointer;font-size:12.5px;border-right:1px solid var(--rule-2)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff;font-weight:500}
.empty{padding:56px 20px;text-align:center;color:var(--ink-3)}
.empty p{font-family:var(--serif);font-size:15px;max-width:46ch;margin:0 auto 14px}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(21,34,43,.35);z-index:60;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(680px,94vw);background:var(--surface);
  z-index:61;transform:translateX(100%);transition:transform .22s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;border-left:1px solid var(--rule);
}
.drawer.on{transform:none}
.drawer-h{padding:16px 20px;border-bottom:1px solid var(--rule);display:flex;gap:12px;align-items:flex-start}
.drawer-h h3{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em}
.drawer-b{overflow:auto;padding:20px;flex:1}
.drawer-f{padding:14px 20px;border-top:1px solid var(--rule);display:flex;gap:8px;align-items:center;background:var(--paper)}
.dl{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;font-size:13px;margin:0 0 20px}
.dl dt{color:var(--ink-3)}
.dl dd{margin:0}
.sect{margin:0 0 22px}
.sect > h4{margin:0 0 8px;font-size:12.5px;font-weight:600;padding-bottom:5px;border-bottom:1px solid var(--rule-2)}
.thumb{width:100%;aspect-ratio:4/3;border:1px solid var(--rule);border-radius:3px;background:var(--paper-2);display:grid;place-items:center;overflow:hidden;position:relative}
.thumb svg{width:100%;height:100%}
.redact{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.rbox{border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.rbox > header{padding:7px 10px;background:var(--paper);border-bottom:1px solid var(--rule-2);font-size:12px;font-weight:600;display:flex;gap:8px;align-items:center}
.rbox .body{padding:12px;font-family:var(--serif);font-size:13.5px;line-height:1.6;white-space:pre-wrap;max-height:280px;overflow:auto}
.rd{background:var(--ink);color:var(--ink);border-radius:2px;padding:0 3px;font-family:var(--mono);font-size:12px}
.rd.lbl{background:#2B3A45;color:#CFE0EA}
.pii-list{display:flex;flex-wrap:wrap;gap:6px}
.toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{
  background:var(--ink);color:#fff;padding:9px 15px;border-radius:3px;font-size:13px;
  box-shadow:0 10px 30px -12px rgba(0,0,0,.6);animation:rise .2s ease-out;
}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.progress{height:8px;background:var(--paper-2);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--signal);transition:width .3s}
.log{font-family:var(--mono);font-size:11.5px;line-height:1.7;max-height:190px;overflow:auto;color:var(--ink-2)}
.log b{color:var(--keep);font-weight:500}
.tree{font-family:var(--mono);font-size:12px;line-height:1.75;white-space:pre;color:var(--ink-2);overflow:auto}
.facets{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.facets button{border:1px solid var(--rule);background:var(--surface);border-radius:12px;padding:3px 10px;font-size:12px;cursor:pointer}
.facets button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.hit{border-bottom:1px solid var(--rule-2);padding:13px 0}
.hit h5{margin:0 0 3px;font-size:14px;font-weight:600}
.hit h5 button{background:none;border:0;padding:0;font:inherit;color:var(--signal);cursor:pointer;text-align:left}
.callout{border-left:3px solid var(--signal);background:var(--signal-soft);padding:11px 14px;border-radius:0 3px 3px 0;font-family:var(--serif);font-size:13.5px;line-height:1.5}
.callout.warn{border-color:var(--archive);background:var(--archive-soft)}
.steps{display:flex;gap:0;border:1px solid var(--rule);border-radius:4px;overflow:hidden;background:var(--surface);margin-bottom:20px}
.steps div{flex:1;padding:11px 14px;border-right:1px solid var(--rule-2);font-size:12.5px;color:var(--ink-3)}
.steps div:last-child{border-right:0}
.steps div.on{background:var(--ink);color:#fff;font-weight:500}
.steps div.done{background:var(--signal-soft);color:var(--signal)}
@media (max-width:1100px){
  .grid3,.stat-row{grid-template-columns:1fr 1fr}
  .shelf{grid-template-columns:1fr}
  .bin + .arrow{display:none}
  .bin + .bin{border-top:1px solid var(--rule-2)}
  .redact{grid-template-columns:1fr}
  .ledger.fixed{table-layout:auto}
}
@media (max-width:820px){
  .app{flex-direction:column}
  .rail{width:100%;flex:none;height:auto;position:static}
  .rail-foot,.nav-group > span{display:none}
  .nav{display:flex;overflow-x:auto;padding:8px}
  .nav-group{margin:0;display:flex}
  .nav button{white-space:nowrap}
  .grid2{grid-template-columns:1fr}
  .stat-row,.grid3{grid-template-columns:1fr}
  .view,.topbar{padding-left:16px;padding-right:16px}
}

.fgroups{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.fgroup{border:1px solid var(--rule);background:var(--paper,#fff);min-width:170px}
.fgroup summary{padding:7px 11px;cursor:pointer;font-size:13px;list-style:none}
.fgroup summary::-webkit-details-marker{display:none}
.fgroup summary::before{content:"\25B8 ";color:var(--ink-3)}
.fgroup[open] summary::before{content:"\25BE "}
.fgroup label{display:block;padding:4px 11px 4px 22px;font-size:12.5px;cursor:pointer}
.fgroup label:last-child{padding-bottom:9px}
.fgroup input{margin-right:6px}
.sresult:hover{background:var(--paper-2,#f6f6f4)}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <h1>Accession Workbench</h1>
      <p>RIMS backlog processing · prototype</p>
    </div>
    <nav class="nav" id="nav">
      <div class="nav-group">
        <span>Processing</span>
        <button data-view="dash">How the pipeline works</button>
        <button data-view="forms">Accession forms</button>
        <button data-view="intake">New accession</button>
        <button data-view="queue">Scheduled queue <span class="n" id="nav-queue"></span></button>
      </div>
      <div class="nav-group">
        <span>Review</span>
        <button data-view="triage">Triage ledger <span class="n" id="nav-triage"></span></button>
        <button data-view="search">Search dataset</button>
        <button data-view="publish">Publish &amp; export</button>
      </div>
      <div class="nav-group">
        <span>Background</span>
        
        <button data-view="built">What exists now</button>
        <button data-view="poc1">Image intelligence</button>
        <button data-view="poc2">Smart file search</button>
        <button data-view="poc3">Email archiving</button>
      </div>
    </nav>
    <div class="rail-foot">
      <strong><span class="dot"></span>Box connected</strong>
      <span id="rail-conn">uillinois.app.box.com · svc-rims</span>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <div>
        <h2 id="vt">Pipeline</h2>
        <p id="vs"></p>
      </div>
      <div class="spacer"></div>
      <div id="vactions"></div>
    </div>

    <!-- PIPELINE -->
    <section class="view hidden" id="v-dash"></section>
    <!-- INTAKE -->
    <section class="view hidden" id="v-intake"></section>
    <!-- QUEUE -->
    <section class="view hidden" id="v-queue"></section>
    <!-- TRIAGE -->
    <section class="view hidden" id="v-triage"></section>
    <!-- SEARCH -->
    <section class="view hidden" id="v-search"></section>
    <!-- PUBLISH -->
    <section class="view hidden" id="v-publish"></section>
    <!-- CAPACITY -->
    <section class="view hidden" id="v-capacity"></section>
    <!-- ABOUT -->
    <section class="view hidden" id="v-forms"></section>
    <section class="view hidden" id="v-built"></section>
    <section class="view hidden" id="v-poc1"></section>
    <section class="view hidden" id="v-poc2"></section>
    <section class="view hidden" id="v-poc3"></section>
  </main>
</div>

<div class="scrim" id="scrim"></div>

/* ---------- redaction engine (POC 2) -------------------------
   Tier 1 = direct identifiers. Removed from both release versions.
   Tier 2 = indirect / quasi identifiers. Removed only from the
   open-web version, because in combination they re-identify.
   ------------------------------------------------------------ */
const PII_LABELS = {
  ssn:'SSN', phone:'PHONE', address:'HOME ADDRESS', dob:'DATE OF BIRTH',
  account:'ACCOUNT NO', health:'HEALTH INFO', uin:'STUDENT ID', salary:'COMPENSATION',
  person:'NAME', email:'EMAIL', title:'JOB TITLE', org:'AFFILIATION', money:'AMOUNT'
};
const TIER1 = new Set(['ssn','phone','address','dob','account','health','uin','salary']);
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function redact(body, entities, level){
  let out = body;
  const use = entities.filter(e => level==='full' ? true : TIER1.has(e.type));
  // Build the target list longest-first so overlapping spans replace cleanly.
  // Names also get their individual tokens, because correspondence switches to
  // first names two lines in and a full-string match would sail past that.
  const targets = [];
  use.forEach(e=>{
    targets.push([e.value, e.type]);
    if(e.type==='person') e.value.split(/\s+/).forEach(tok=>{ if(tok.length>=3) targets.push([tok,'person']); });
  });
  targets.sort((a,b)=>b[0].length-a[0].length).forEach(([v,type])=>{
    const pre = /^\w/.test(v) ? '\\b' : '', post = /\w$/.test(v) ? '\\b' : '';
    out = out.replace(new RegExp(pre + reEsc(v) + post, 'g'), '[' + PII_LABELS[type] + ' REDACTED]');
  });
  return out;
}
function markRedactions(text){
  return esc(text).replace(/\[([A-Z ]+) REDACTED\]/g, (m,g)=>'<span class="rd lbl">['+g+']</span>');
}

/* ---------- deterministic pseudo-random ---------- */
let _seed = 20260903;
function rnd(){ _seed = (_seed*1103515245 + 12345) & 0x7fffffff; return _seed/0x7fffffff; }
const pick = a => a[Math.floor(rnd()*a.length)];
const between = (a,b) => a + rnd()*(b-a);

async function loadData(){

    S.records.forEach(r => {

      r.generated = Array.isArray(r.generated) ? r.generated : [];

}

/* ============================================================
   Triage ledger — the working surface
   ============================================================ */
const IMP_ORDER = { high:0, medium:1, low:2 };
function filtered(){
  const f = S.filters, q = f.q.trim().toLowerCase();
  let out = S.records.filter(r=>{
    if(f.job!=='all' && r.jobId!==f.job) return false;
    if(f.kind!=='all' && r.kind!==f.kind) return false;
    if(f.imp!=='all' && r.importance!==f.imp) return false;
    if(f.flag!=='all' && !r.flags.some(x=>String(x).toLowerCase().includes(f.flag))) return false;
    if(f.folder && (r.folder||'(root)') !== f.folder) return false;
    if(f.dispo==='none' && r.dispo) return false;
    if(f.dispo!=='all' && f.dispo!=='none' && r.dispo!==f.dispo) return false;
    if(q && !(r.title+' '+r.description+' '+r.filename+' '+r.keywords.join(' ')+' '+r.rationale).toLowerCase().includes(q)) return false;
    return true;
  });
  const s = S.sort;
  out.sort((a,b)=>
    s==='imp'   ? (IMP_ORDER[a.importance]-IMP_ORDER[b.importance]) || ((b.confidence||0)-(a.confidence||0))
  : s==='conf'  ? (a.confidence||0)-(b.confidence||0)
  : s==='flag'  ? b.flags.length-a.flags.length
  : s==='name'  ? a.filename.localeCompare(b.filename)
  : 0);
  return out;
}
function flagTag(f){
  // Render the flag the pipeline actually emitted. The previous version looked
  // the string up in a fixed table built for the generated corpus, so every
  // real flag — "needs a person", "kept by association", "3 identifiers",
  // and every sensitivity category — rendered as "undefined".
  const s = String(f||'');
  const serious = /needs a person|identifier|sensitiv|restricted|remains|nudity|violence|hate|medical|student|racialis|racializ|native american/i.test(s);
  const quiet   = /duplicate|not read|structural|near_duplicate|system/i.test(s);
  const cls = serious ? 't-flag' : (quiet ? 't-mute' : 't-archive');
  return '<span class="tag '+cls+'" title="'+esc(s)+'">'+esc(s)+'</span>';
}
function impCell(r){
  const label = { high:'High', medium:'Medium', low:'Low' }[r.importance];
  return '<div class="imp '+r.importance+'"><span class="pip"><i></i><i></i><i></i></span>'
       + '<span>'+label+'</span></div>'
       // A lexical run has no calibrated confidence. Printing "0%" reads as
       // "the model is certain this is worthless", which is the opposite of
       // what a null means.
       + (r.confidence == null
          ? '<span class="conf" title="scored lexically; no calibrated confidence">not scored</span>'
          : '<span class="conf">confidence '+pct(r.confidence)+'</span>');
}
function dispoCell(r){
  // An auto-applied proposal is not a decision. Showing it as one would make
  // the decision record — the thing that answers "who decided this" in five
  // years — worthless.
  // An auto-applied proposal is labelled as one, but the buttons MUST stay:
  // returning a static tag here removed every control from 1,282 rows, which
  // made the ledger unusable for exactly the files most in need of review.
  const stamp = r.autoApplied
    ? '<div><span class="tag" style="border-color:var(--ochre,#8E6410);'
      + 'color:var(--ochre,#8E6410)" title="Applied from the pipeline\'s own '
      + 'proposal. No person has reviewed this.">unreviewed</span></div>'
    : (r.decidedBy
       ? '<div class="fname" style="margin-bottom:3px">' + esc(r.decidedBy) + '</div>'
       : '');
  const b = d => '<button data-act="dispo" data-id="'+r.id+'" data-d="'+d+'" class="'+(r.dispo===d?'on':'')+'"'
    + ' title="'+({selected:'Selected — matched a retention criterion',restricted_review:'Send to a supervising archivist — sensitivity outranks ranking',discard_candidate:'Discard candidate — proposed for disposal after the retention window; never removed here'}[d])+'"'
    + ' aria-label="'+d+' '+esc(r.filename)+'">'+({selected:'✓',restricted_review:'⚑',discard_candidate:'◌'}[d])+'</button>';
  return stamp + '<div class="dispo">'+b('selected')+b('restricted_review')+b('discard_candidate')+'</div>';
}

function proxySVG(r){
  let h=0; for(const c of r.filename) h = (h*31 + c.charCodeAt(0)) & 0xffff;
  const hz = 45 + (h%30), a = h%7, b = (h>>3)%5;
  return `<svg viewBox="0 0 400 300" role="img" aria-label="Placeholder for ${esc(r.filename)}">
    <rect width="400" height="300" fill="#DFE4E7"/>
    <rect y="${hz*2}" width="400" height="${300-hz*2}" fill="#CBD5DA"/>
    <g fill="#B6C3CA">${Array.from({length:3+a},(_,i)=>`<rect x="${20+i*47}" y="${hz*2-14-((i*13+b*7)%46)}" width="${16+b*3}" height="${20+((i*11)%50)}"/>`).join('')}</g>
    <line x1="0" y1="${hz*2}" x2="400" y2="${hz*2}" stroke="#8FA0A9" stroke-width="1.5"/>
    <g fill="#8FA0A9" font-family="IBM Plex Mono, monospace" font-size="11">
      <text x="14" y="24">${esc(r.filename)}</text>
      <text x="14" y="288">preview not fetched in demo — open in Box</text>
    </g>
    <rect x="1" y="1" width="398" height="298" fill="none" stroke="#8FA0A9" stroke-dasharray="3 4"/>
  </svg>`;
}

function renderSearch(){
  const q = S.search.q.trim().toLowerCase();
  const f = S.search.facets;

  // File-type groups, built from what is actually in the data rather than a
  // fixed list. Anything the pipeline saw that does not fall into a known
  // group appears under "Other" and stays selectable — an ArcGIS file nobody
  // anticipated must not become invisible.
  const GROUPS = {
    "Images":      ["jpg","jpeg","png","tif","tiff","gif","bmp","heic"],
    "Text documents":["pdf","doc","docx","txt","rtf","odt","ppt","pptx","htm","html"],
    "Email":       ["eml","msg","mbox","pst"],
    "Spreadsheets and data":["xls","xlsx","csv","tsv","mdb","accdb","db"],
    "Audio and video":["mp4","mov","avi","mp3","wav","m4a","wmv","mkv"]
  };
  const extOf = r => (r.filename||"").split(".").pop().toLowerCase();
  const seen = {};
  S.records.forEach(r=>{ const e = extOf(r); seen[e] = (seen[e]||0)+1; });
  const known = new Set(Object.values(GROUPS).flat());
  const others = Object.keys(seen).filter(e => !known.has(e) && e && e.length <= 8).sort();
  if(others.length) GROUPS["Other"] = others;

  const acc = S.search.job || "";
  // The search dataset is a REVIEW surface, not an archive. It holds what is
  // waiting on a person. Once a file has a recorded decision it has left the
  // review stage and belongs in the delivered package, not here — otherwise
  // this view grows without bound and an archivist searching it is searching
  // years of already-settled material.
  const SEARCH_CAP = 2000;
  let pool = S.records.filter(r => r.dispo !== 'restricted_review'
                                && !r.flags.includes('needs a person')
                                && !(r.dispo && !r.autoApplied));
  const settled = S.records.filter(r => r.dispo && !r.autoApplied).length;
  if(acc) pool = pool.filter(r => r.jobId === acc);

  const chosenExt = [...f].filter(x => x.startsWith("e:")).map(x => x.slice(2));
  const chosenImp = [...f].filter(x => x.startsWith("i:")).map(x => x.slice(2));
  if(chosenExt.length) pool = pool.filter(r => chosenExt.includes(extOf(r)));
  if(chosenImp.length) pool = pool.filter(r => chosenImp.includes(r.importance));
  if(q) pool = pool.filter(r =>
    (r.title+' '+r.description+' '+r.keywords.join(' ')).toLowerCase().includes(q));

  const withheld = S.records.filter(r => r.dispo === 'restricted_review'
                                      || r.flags.includes('needs a person')).length;

  const groupUI = Object.entries(GROUPS).map(([g,exts])=>{
    const present = exts.filter(e=>seen[e]);
    if(!present.length) return "";
    const n = present.reduce((a,e)=>a+seen[e],0);
    const allOn = present.every(e=>f.has("e:"+e));
    return `<details class="fgroup"><summary>${esc(g)} <span class="muted">${n}</span>${
      allOn?' <span class="tag t-keep">all</span>':''}</summary>
      <label><input type="checkbox" data-fx="group" data-g="${esc(g)}" ${allOn?'checked':''}> All ${esc(g.toLowerCase())}</label>
      ${present.map(e=>`<label><input type="checkbox" data-fx="ext" data-e="${esc(e)}"
        ${f.has("e:"+e)?'checked':''}> .${esc(e)} <span class="muted">${seen[e]}</span></label>`).join('')}
    </details>`;}).join('');

  $('#v-search').innerHTML = `
  <div class="panel">
    <div class="panel-b" style="padding-bottom:10px">
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px">
        <label style="font-size:12.5px;color:var(--ink-3);align-self:center">Select accession file</label>
        <select id="s-acc" style="min-width:280px">
          <option value="">All processed accessions</option>
          ${S.jobs.filter(j=>j.status==='complete').map(j=>
            `<option value="${j.id}" ${acc===j.id?'selected':''}>${esc(j.id)} — ${esc(j.name)}</option>`).join('')}
        </select>
        ${['high','medium','low'].map(b=>`<button class="btn btn-sm ${f.has('i:'+b)?'btn-primary':''}"
          data-fx="imp" data-i="${b}">Ranked ${b}</button>`).join('')}
        <button class="btn btn-sm" data-fx="clear">Clear</button>
      </div>
      <input type="search" id="s-q" value="${esc(S.search.q)}" style="width:100%"
        placeholder="Search generated titles, descriptions and subjects">
      <div class="fgroups">${groupUI}</div>
    </div>
  </div>

  <div class="panel" style="margin-top:14px">
    <div class="panel-h"><h3>${n(pool.length)} records</h3><div class="spacer"></div>
      <span class="muted" style="font-size:12.5px">${n(withheld)} withheld for a person
        · ${n(settled)} reviewed and moved out${
        pool.length > SEARCH_CAP ? ' · showing the first '+n(SEARCH_CAP) : ''}</span></div>
    ${pool.length ? `<div style="max-height:64vh;overflow:auto">${pool.slice(0,SEARCH_CAP).slice(0,300).map(r=>`
      <div class="sresult" style="padding:13px 18px;border-bottom:1px solid var(--rule)">
        <button class="rtitle" data-act="open" data-id="${r.id}">${esc(r.title)}</button>
        <div class="muted" style="font-size:12px;margin:2px 0 5px">${esc(r.jobId)} ·
          ${esc(r.kind)}${r.date?' · '+esc(r.date):''} · ${r.dispo?esc(r.dispo):'undecided'}</div>
        ${(r.flags||[]).length ? `<div style="margin:3px 0 5px">${
          r.flags.map(flagTag).join(' ')}</div>` : ''}
        <div style="font-size:13.5px;color:var(--ink-2)">${esc(
          // Two sentences. An archivist scanning results needs to know what a
          // thing is, not to read the opening of it.
          ((r.description||'').match(/[^.!?]+[.!?]+/g) || [r.description||''])
            .slice(0,2).join(' ').trim().slice(0,260))}</div>
        ${r.keywords.length?`<div class="muted" style="font-size:12px;margin-top:4px">${
          esc(r.keywords.slice(0,8).join(' · '))}</div>`:''}
      </div>`).join('')}</div>`
      : `<div class="empty"><p>Nothing matches. The dataset is indexed on generated description
         and subjects, not on original filenames.</p></div>`}
  </div>`;

  const qi = document.getElementById('s-q');
  qi.addEventListener('input', e=>{ S.search.q = e.target.value; render('search'); });
  qi.setSelectionRange(qi.value.length, qi.value.length); qi.focus();
  document.getElementById('s-acc').addEventListener('change', e=>{
    S.search.job = e.target.value; render('search'); });
  document.querySelectorAll('[data-fx]').forEach(el=>{
    const kind = el.dataset.fx;
    const fire = () => {
      if(kind === 'clear'){ S.search.facets.clear(); S.search.job=''; }
      if(kind === 'imp'){ const k='i:'+el.dataset.i;
        S.search.facets.has(k) ? S.search.facets.delete(k) : S.search.facets.add(k); }
      if(kind === 'ext'){ const k='e:'+el.dataset.e;
        S.search.facets.has(k) ? S.search.facets.delete(k) : S.search.facets.add(k); }
      if(kind === 'group'){
        // Whole-group toggle. Checking "All images" should behave the same as
        // ticking every extension inside it, so the two stay consistent.
        const exts = GROUPS[el.dataset.g] || [];
        const on = exts.every(e => !seen[e] || S.search.facets.has('e:'+e));
        exts.filter(e=>seen[e]).forEach(e =>
          on ? S.search.facets.delete('e:'+e) : S.search.facets.add('e:'+e));
      }
      render('search');
    };
    el.addEventListener(el.tagName === 'BUTTON' ? 'click' : 'change', fire);
  });
}

/* ============================================================
   Publish & export
   ============================================================ */
function renderPublish(){
  // Organised by DESTINATION, not by decision. What an archivist needs here is
  // "where does this end up", and the answer forks three ways: preserved and
  // open, preserved and closed, or not selected. Preservation is not
  // conditional on access — restricted material is still preserved, it simply
  // has no access copy. Conflating those is how closed material ends up
  // unpreserved.
  const DEST = {
    medusa_open:   {label:'Medusa + Digital Library', sub:'preserved and openly available', c:'var(--keep)'},
    medusa_closed: {label:'Medusa only',              sub:'preserved, closed pending review', c:'var(--archive)'},
    supervisor:    {label:'Supervising archivist',    sub:'not released until a person decides', c:'var(--drop)'},
    not_selected:  {label:'Not selected',             sub:'retained through the review window', c:'var(--ink-3)'},
    excluded:      {label:'Excluded at triage',       sub:'duplicates and structural noise', c:'var(--ink-3)'}
  };
  const destOf = r =>
      r.flags.includes('duplicate') || r.flags.some(f=>/exclusion|structural/.test(f)) ? 'excluded'
    : r.dispo === 'restricted_review' || r.importance === 'high' ? 'supervisor'
    : r.dispo === 'discard_candidate' ? 'not_selected'
    : r.dispo === 'selected' ? (r.flags.some(f=>/identifier/.test(f)) ? 'medusa_closed' : 'medusa_open')
    : 'not_selected';

  const g = {};
  Object.keys(DEST).forEach(k=>g[k]=[]);
  S.records.forEach(r=>g[destOf(r)].push(r));
  const decided = S.records.filter(r=>r.dispo).length;

  const tree = S.jobs.map(j=>{
    const own = k => g[k].filter(r=>r.jobId===j.id).length;
    return '/RIMS/RELEASE/'+j.id+'/\n'
      + '  ├── medusa/\n'
      + '  │     ├── open/            '+String(own('medusa_open')).padStart(5)+' files, access copy to the Digital Library\n'
      + '  │     └── closed/          '+String(own('medusa_closed')).padStart(5)+' files, preserved with no access copy\n'
      + '  ├── supervising_review/    '+String(own('supervisor')).padStart(5)+' files, nothing leaves until a person decides\n'
      + '  ├── not_selected/          '+String(own('not_selected')).padStart(5)+' files, held through the retention window\n'
      + '  ├── redacted/\n'
      + '  │     ├── reading_room/    direct identifiers replaced\n'
      + '  │     └── open_web/        indirect identifiers replaced as well\n'
      + '  ├── manifest.parquet       one row per file, every decision and its reason\n'
      + '  ├── decisions.csv          who decided what, when, and whether they agreed\n'
      + '  └── pii_map.json           re-identification key — stored separately, access controlled';
  }).join('\n\n');

  $('#v-publish').innerHTML = `
  <div class="stat-row">
    <div class="stat"><div class="k">Reviewed by a person</div>
      <div class="v">${n(decided)} <span style="font-size:15px;color:var(--ink-3)">/ ${n(S.records.length)}</span></div>
      <div class="bar"><i style="width:${decided/Math.max(1,S.records.length)*100}%;background:var(--signal)"></i></div>
      <div class="sub">${n(S.records.length-decided)} still carry only the pipeline's proposal</div></div>
    ${Object.entries(DEST).slice(0,4).map(([k,v])=>`
    <div class="stat"><div class="k">${esc(v.label)}</div>
      <div class="v" style="color:${v.c}">${n(g[k].length)}</div>
      <div class="sub">${esc(v.sub)}</div></div>`).join('')}
  </div>

  <div class="grid2" style="margin-top:16px">
    <div class="panel"><div class="panel-h"><h3>Where each file goes</h3></div><div class="panel-b">
      ${Object.entries(DEST).map(([k,v])=>`
        <div style="display:flex;gap:12px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--rule)">
          <div style="width:9px;height:9px;background:${v.c};border-radius:2px;flex:none"></div>
          <div style="flex:1"><strong>${esc(v.label)}</strong>
            <div class="muted" style="font-size:12.5px">${esc(v.sub)}</div></div>
          <div class="mono">${n(g[k].length)}</div>
        </div>`).join('')}
      <p class="muted" style="font-size:12.5px;margin:12px 0 0">Nothing is deleted at
      this step. "Not selected" means retained through the review window while a
      person decides; disposal is a later, separate, deliberate act.</p>
    </div></div>

    <div class="panel"><div class="panel-h"><h3>What gets written</h3></div><div class="panel-b">
      <div class="tree">${esc(tree)}</div>
    </div></div>
  </div>

  <div class="panel" style="margin-top:16px"><div class="panel-h"><h3>Package for delivery</h3></div>
    <div class="panel-b">
      <p class="muted" style="font-size:13px;margin-top:0">Choose which version of each file
      leaves. All three are stored — the archivist always keeps access to the original, whatever
      is released.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 14px">
        ${[["reading_room","Reading room","direct identifiers replaced — for a researcher on site"],
           ["open_web","Open web","direct and indirect identifiers replaced — for publication"],
           ["original","Original only","no release; archivist access alone"]].map(([v,l,d])=>`
          <label style="flex:1;min-width:210px;border:1px solid var(--rule);padding:11px 13px;cursor:pointer">
            <input type="radio" name="rel" value="${v}" ${v==='reading_room'?'checked':''}>
            <b>${l}</b><div class="muted" style="font-size:12.5px;margin-top:2px">${d}</div></label>`).join('')}
      </div>
      <p class="muted" style="font-size:13px;margin:14px 0 6px">What goes in</p>
      <div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px">
        ${Object.entries(DEST).filter(([k])=>k!=='supervisor').map(([k,v])=>`
          <label style="font-size:13.5px"><input type="checkbox" data-inc="${k}"
            ${k==='medusa_open'||k==='medusa_closed'?'checked':''}>
            ${esc(v.label)} <span class="muted">${n(g[k].length)}</span></label>`).join('')}
        <label style="font-size:13.5px;color:var(--drop)" title="Never included">
          <input type="checkbox" disabled> Supervising archivist
          <span class="muted">${n(g.supervisor.length)}</span> — never packaged</label>
      </div>
      <button class="btn btn-primary" data-act="package">Build the delivery package</button>
      <span class="muted" style="font-size:12.5px;margin-left:10px">${n(decided)} of
        ${n(S.records.length)} files have a recorded decision. Undecided files are packaged as
        not selected and stay retained.</span>
      <div id="pkg" style="margin-top:14px"></div>
    </div></div>

  <div class="panel" style="margin-top:16px"><div class="panel-h"><h3>Export</h3><div class="spacer"></div>
    <button class="btn btn-sm" data-act="export-ledger">Ledger CSV</button>
    <button class="btn btn-sm" data-act="export-decisions">Decisions CSV</button>
    <button class="btn btn-sm" data-act="export-dataset">Dataset JSON</button></div>
    <div class="panel-b"><p class="muted" style="font-size:12.5px;margin:0">The
    decisions export is the defensibility record: every action, who took it, when,
    and whether it confirmed the pipeline or overrode it. It is the thing to keep
    when someone asks in five years why a file was not kept.</p></div></div>`;
}

/* ---------- exports ---------- */
function dl(name, text, mime){
  const b = new Blob([text], {type:mime});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  toast('Downloaded ' + name);
}
const csvCell = v => '"' + String(v==null?'':v).replace(/"/g,'""').replace(/\r?\n/g,' ') + '"';
function exportLedgerCSV(){
  const head = ['accession','file_id','box_path','filename','kind','date','generated_title','generated_description','subjects','flags','importance','confidence','rationale','decision','decided_at'];
  const rows = S.records.map(r=>[r.jobId,r.boxFileId,r.boxPath,r.filename,r.kind,r.date,r.title,r.description,r.keywords.join('; '),r.flags.join('; '),r.importance,r.confidence,r.rationale,r.dispo||'',r.decidedAt||'']);
  dl('accession-ledger.csv', [head].concat(rows).map(r=>r.map(csvCell).join(',')).join('\n'), 'text/csv');
}
function exportDecisions(){
  const head = ['file_id','filename','accession','model_ranking','model_confidence','flags','human_decision','decided_at','agrees_with_model'];
  const rows = S.records.filter(r=>r.dispo).map(r=>{
    // Agreement is measured against the pipeline's own proposal, not inferred
    // from the importance band. A reviewer who marks a low-ranked file as
    // selected has overridden something specific, and the record should say
    // which thing.
    const proposed = r.importance==='high' ? 'restricted_review' : 'selected';
    const agree = r.dispo === proposed;
    return [r.boxFileId,r.filename,r.jobId,r.importance,r.confidence,r.flags.join('; '),r.dispo,r.decidedAt,agree?'yes':'no'];
  });
  dl('decisions-manifest.csv', [head].concat(rows).map(r=>r.map(csvCell).join(',')).join('\n'), 'text/csv');
}
function exportDataset(){
  const recs = S.records.filter(r=>r.dispo && r.dispo!=='discard_candidate' && !r.flags.includes('restricted'));
  const out = {
    generated: new Date().toISOString(),
    generator: 'Accession Workbench prototype',
    note: 'Every record was ranked by a model and disposed of by a person. The rationale field is the model\u2019s reasoning, retained for audit.',
    accessions: S.jobs.filter(j=>j.status==='complete').map(j=>({ id:j.id, name:j.name, type:j.type, files:j.files, intake:j.intake })),
    records: recs.map(r=>({
      accession:r.jobId, file_id:r.boxFileId, box_path:r.boxPath, box_url:Box.fileUrl(r),
      filename:r.filename, kind:r.kind, date:r.date||null, size_kb:r.sizeKB,
      generated_title:r.title, generated_description:r.description, subjects:r.keywords,
      flags:r.flags, content_note_required:r.flags.includes('sensitive'),
      importance:r.importance, confidence:r.confidence, rationale:r.rationale,
      redaction: r.entities.length? { identifiers_found:r.entities.length,
        direct:r.entities.filter(e=>TIER1.has(e.type)).map(e=>PII_LABELS[e.type]),
        indirect:r.entities.filter(e=>!TIER1.has(e.type)).map(e=>PII_LABELS[e.type]),
        reading_room_text: redact(r.body||'', r.entities, 'light'),
        open_web_text: redact(r.body||'', r.entities, 'full') } : null,
      decision:r.dispo, decided_at:r.decidedAt
    }))
  };
  dl('accession-dataset.json', JSON.stringify(out, null, 2), 'application/json');
}

/* ============================================================
   Run simulation
   ============================================================ */
function synthesize(job){
  const pool = [
    ['Apparatus on an optical bench, unlabelled','A bench-top optical arrangement with mounts, a laser tube, and cabling. No labels or scale in frame.',['apparatus','optical bench','laboratory'],'medium',.72,[]],
    ['Accelerator hall interior during a shutdown','A wide view of an accelerator hall with access panels open and equipment on the floor, apparently mid-maintenance.',['accelerator','maintenance','laboratory interior'],'high',.85,[]],
    ['Lecture demonstration in progress, students visible','An instructor operating a demonstration apparatus at the front of a raked lecture theatre with students seated behind.',['teaching','demonstration','lecture theatre'],'high',.81,[]],
    ['Blank frame, no image content','A blank or near-blank exposure with no recoverable content.',['illegible','blank'],'low',.95,['illegible']],
    ['Instrument rack with hand-lettered labels','A rack of electronics with hand-lettered paper labels on each module, several legible.',['instrumentation','electronics','labels'],'high',.83,[]],
    ['Group of staff outside a laboratory building','An informal line-up of about ten people outside an entrance. No names on the mount.',['group portrait','staff','unidentified'],'medium',.66,[]],
    ['Duplicate exposure of the preceding frame','A near-identical second exposure of the same subject.',['duplicate'],'low',.92,['duplicate']],
    ['Chalkboard with a partial derivation','A chalkboard photographed straight on with a derivation running to the lower edge, mostly legible.',['chalkboard','derivation','teaching'],'medium',.74,[]],
    ['Departmental party with a costumed performance','A crowded room at a departmental party with two people performing in costume. One costume uses an ethnic caricature.',['social','costume','content note required'],'low',.68,['sensitive']]
  ];
  const out = [];
  for(let i=0;i<job.files;i++){
    const p = pool[i % pool.length], y = Math.floor(between(1961,1985));
    out.push(rec({ jobId:job.id, kind:'image', folder:'carousel_'+String(1+(i%12)).padStart(2,'0'),
      filename:'PHYS_B2_'+String(i+1).padStart(4,'0')+'.tif', date:y+'-01-01',
      sizeKB:Math.round(between(30000,52000)),
      title:p[0], description:p[1], keywords:p[2], importance:p[3],
      confidence:+(p[4]+between(-.05,.04)).toFixed(2), flags:p[5],
      exif:{cam:'Kodachrome carousel scan', dims:'4096 × 2731', gps:'not embedded', note:'Carousel label illegible'},
      rationale: p[5].length
        ? 'Blank, duplicate, or unreadable. The intake form excludes these by name, so it is surfaced for deletion.'
        : p[3]==='high'
        ? 'Shows apparatus, a laboratory interior, or people at work — the three things the intake form names for this batch. Equipment of this period is largely gone, which raises the value of the frame.'
        : 'Plausibly in scope but under-identified. No carousel label survived for this tray, so nothing establishes the date or the room beyond the visual evidence.'
    }));
  }
  return out;
}
function runWindow(){
  if(S.running) return;
  const jobs = S.jobs.filter(j=>['queued','locked'].includes(j.status));
  if(!jobs.length){ toast('Nothing is queued for this window'); return; }
  S.running = true; S.log = [];
  go('queue');
  const steps = [];
  jobs.forEach(j=>{
    steps.push(['Connecting to Box as svc-rims — folder '+Box.folders.inbox.name, 0]);
    steps.push([j.id+' · listing '+n(j.files)+' items, '+kb(j.sizeKB), 0]);
    steps.push([j.id+' · sha1 recorded for '+n(j.files)+' files', 0]);
    steps.push([j.id+' · copy → '+Box.folders.originals.name, 1]);
    steps.push([j.id+' · reading the intake form: '+(j.intake.owner||'unknown owner'), 0]);
    steps.push([j.id+' · generating titles and descriptions', 0]);
    steps.push([j.id+' · content and personal-material flags', 0]);
    if(j.type!=='images') steps.push([j.id+' · locating personal information, writing two release versions', 0]);
    steps.push([j.id+' · triage scoring against the retention priorities', 0]);
    steps.push([j.id+' · writing sidecars → '+Box.folders.transformed.name, 1]);
    steps.push([j.id+' · moving originals out of '+Box.folders.inbox.name, 1]);
    steps.push([Box.folders.inbox.name+' is empty for '+j.id, 2]);
  });
  let i = 0;
  const tick = setInterval(()=>{
    if(i>=steps.length){
      clearInterval(tick);
      jobs.forEach(j=>{
        if(!S.records.some(r=>r.jobId===j.id)) S.records = S.records.concat(synthesize(j));
        j.status='complete';
        j.ranAt = new Date().toLocaleString('en-US',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
        j.minutes = Math.round(estHours(j)*60);
      });
      S.running = false;
      S.log.push('<b>Run complete. '+n(jobs.reduce((a,j)=>a+j.files,0))+' files described and waiting for review.</b>');
      render('queue');
      toast('Run complete — '+n(jobs.reduce((a,j)=>a+j.files,0))+' files ready to triage');
      return;
    }
    const [msg, kind] = steps[i++];
    S.log.push(kind===2? '<b>'+msg+'</b>' : msg);
    const el = $('#log'); if(el){ el.innerHTML = S.log.join('<br>'); el.scrollTop = el.scrollHeight; }
    const p = $('#prog'); if(p) p.style.width = Math.round(i/steps.length*100)+'%';
  }, 320);
}

/* ============================================================
   Events
   ============================================================ */
document.addEventListener('click', e=>{
  const nav = e.target.closest('#nav button');
  if(nav){ go(nav.dataset.view); return; }
  const facet = e.target.closest('[data-facet]');
  if(facet){
    const f = facet.dataset.facet;
    if(f==='clear') S.search.facets.clear();
    else S.search.facets.has(f) ? S.search.facets.delete(f) : S.search.facets.add(f);
    render('search'); return;
  }
  const sortB = e.target.closest('[data-sort]');
  if(sortB){ S.sort = sortB.dataset.sort; render('triage'); return; }
  const a = e.target.closest('[data-act]');
  if(!a) return;
  // A row is clickable, but the controls inside it are their own actions.
  // Without this, ticking a checkbox or recording a decision also opens the
  // drawer, which makes bulk work impossible.
  if(a.dataset.act === 'open' && e.target.closest('input,button,select,label')
     && !e.target.closest('.rtitle')) return;
  const act = a.dataset.act, id = a.dataset.id;
  switch(act){
    case 'goto': go(a.dataset.v); break;
    case 'open': openDrawer(id); break;
    case 'close': closeDrawer(); break;
    case 'job': openJobDrawer(id); break;
    case 'filter-job': closeDrawer(); S.filters = {job:id,kind:'all',imp:'all',flag:'all',dispo:'all',q:''}; go('triage'); break;
    case 'resetfilters': S.filters = {job:'all',kind:'all',imp:'all',flag:'all',dispo:'all',q:''}; render('triage'); break;
    case 'review-undecided': S.filters = {job:'all',kind:'all',imp:'all',flag:'all',dispo:'none',q:''}; go('triage'); break;
    case 'dispo': {
      const r = S.records.find(x=>x.id===id); if(!r) break;
      const d = a.dataset.d;
      r.dispo = r.dispo===d ? null : d;
      r.decidedAt = r.dispo ? new Date().toISOString().slice(0,16).replace('T',' ') : null;
      if(S.view==='triage') render('triage'); else if(S.view==='publish') render('publish'); else if(S.view==='search') render('search');
      if(S.drawerId===id) openDrawer(id);
      break;
    }
    case 'qup': case 'qdn': {
      // Queue order is the archivist's call, not the system's. A collection
      // with a researcher waiting on it should be able to jump ahead of a
      // larger one that nobody is asking for.
      const i = S.jobs.findIndex(x=>x.id===id);
      const to = act==='qup' ? i-1 : i+1;
      if(i>=0 && to>=0 && to<S.jobs.length){
        const [m] = S.jobs.splice(i,1); S.jobs.splice(to,0,m); render('queue');
      }
      break;
    }
    case 'package': {
      const lvl = (document.querySelector('input[name=rel]:checked')||{}).value || 'reading_room';
      const inc = [...document.querySelectorAll('[data-inc]:checked')].map(x=>x.dataset.inc);
      const g = {}; S.records.forEach(r=>{ const k = r.dispo||'not_selected'; (g[k]=g[k]||[]).push(r); });
      const stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
      document.getElementById('pkg').innerHTML =
        '<div class="callout" style="border:1px solid var(--rule);padding:12px 14px">'
        + '<b>Package ready</b> — release level <code>'+esc(lvl)+'</code>, built '+stamp+'.'
        + '<div style="font-size:13px;margin-top:6px">Includes: '
        + (inc.length ? inc.map(k=>esc(k.replace(/_/g," "))+' ('+((g[k]||[]).length)+')').join(', ')
                      : '<i>nothing selected</i>') + '</div>'
        + '<div class="muted" style="font-size:12.5px;margin:6px 0 10px">Contains the selected '
        + 'files at the chosen release level, the manifest, the decision record, and the '
        + 'PII map as a separate access-controlled file. Nothing flagged for a supervising '
        + 'archivist is included.</div>'
        + '<button class="btn btn-sm" data-act="export-dataset">Download dataset JSON</button> '
        + '<button class="btn btn-sm" data-act="export-decisions">Download decision record</button> '
        + '<button class="btn btn-sm" data-act="export-ledger">Download full ledger</button>'
        + '</div>';
      toast('Package built at ' + lvl + ' — ' + ((g.selected||[]).length) + ' files');
      break;
    }
    case 'reprocess': {
      // Correcting a form and re-running is the intended repair path. The
      // previous run is kept: a re-run produces a new manifest rather than
      // overwriting the record of what was decided last time.
      const j2 = jobById(id); if(!j2) break;
      j2.status = 'queued'; j2.reprocess = true;
      openJobDrawer(id);
      toast(id + ' returned to the queue for reprocessing — the previous run is kept');
      break;
    }
    case 'folder': {
      // Selecting a folder narrows the ledger to it. Walking the tree is the
      // point of the folder view — reading counts without being able to open
      // the folder they describe is a report, not a tool.
      const f = a.dataset.f;
      S.filters.folder = (S.filters.folder === f) ? null : f;
      render('triage');
      break;
    }
    case 'sfacet': break;
    case 'bulkband': {
      // Everything undecided in the current view at this band, EXCEPT anything
      // flagged for a person. A bulk action that swept up sensitive material
      // would defeat the one rule the whole design rests on.
      const band = a.dataset.b, now = new Date().toISOString().slice(0,16).replace('T',' ');
      let c = 0, held = 0;
      filtered().forEach(r=>{
        if(r.dispo || r.importance !== band) return;
        if(r.importance === 'high' || r.flags.includes('needs a person')){ held++; return; }
        r.dispo = 'selected'; r.decidedAt = now; r.bulk = true; c++;
      });
      render('triage');
      toast(c + ' marked selected' + (held ? ' · ' + held + ' held back for individual review' : ''));
      break;
    }
    case 'bulk': {
      const d = a.dataset.d, now = new Date().toISOString().slice(0,16).replace('T',' ');
      let c=0;
      S.records.forEach(r=>{ if(S.sel.has(r.id)){ r.dispo=d; r.decidedAt=now; c++; }});
      S.sel.clear(); render('triage'); toast(c+' files marked '+d);
      break;
    }
    case 'clearsel': S.sel.clear(); render('triage'); break;
    case 'step': {
      const list = filtered(), i = +a.dataset.i;
      if(list[i]) openDrawer(list[i].id);
      break;
    }
    case 'run': runWindow(); break;
    case 'save-settings': {
      S.settings.day = +$('#s-day').value; S.settings.start = +$('#s-start').value;
      S.settings.hours = Math.max(1,+$('#s-hours').value);
      S.settings.maxFiles = +$('#s-maxf').value; S.settings.maxGB = +$('#s-maxg').value;
      ['image','email','document','media'].forEach(k=> S.settings.rates[k] = Math.max(1,+$('#s-r-'+k).value));
      render('capacity'); toast('Window saved — ' + windowLabel());
      break;
    }
    case 'prefill': {
      const k = jobById('ACC-2026-014');
      S.intakeDraft = Object.assign({}, k.intake, { type:'images', name:k.name, filters:['images'], boxFolder:k.intake.boxFolder });
      render('intake'); toast('Filled from ACC-2026-014');
      break;
    }
    case 'edit-intake': {
      const j = jobById(id);
      S.intakeDraft = Object.assign({}, j.intake, { type:j.type, name:j.name, filters:['images','email','documents'] });
      S.intakeDraft._job = id;
      closeDrawer(); go('intake'); toast('Editing ' + id + ' — locks one hour before the window');
      break;
    }
    case 'submit-intake': submitIntake(); break;
    case 'dl-json': exportDataset(); break;
    case 'dl-csv': exportLedgerCSV(); break;
    case 'dl-dec': exportDecisions(); break;
  }
});
document.addEventListener('change', e=>{
  const t = e.target;
  if(t.dataset.act==='sel'){
    t.checked ? S.sel.add(t.dataset.id) : S.sel.delete(t.dataset.id);
    render('triage'); return;
  }
  if(t.dataset.act==='selall'){
    const rows = filtered();
    t.checked ? rows.forEach(r=>S.sel.add(r.id)) : S.sel.clear();
    render('triage'); return;
  }
  if(t.dataset.f){ S.filters[t.dataset.f] = t.value; S.sel.clear(); render('triage'); return; }
});
document.addEventListener('input', e=>{
  const t = e.target;
  if(t.dataset.f==='q'){ S.filters.q = t.value; clearTimeout(window._d);
    window._d = setTimeout(()=>{ render('triage'); const el=$('#v-triage [data-f=q]'); if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);} }, 250); return; }
  if(t.id==='q'){ S.search.q = t.value; clearTimeout(window._d2);
    window._d2 = setTimeout(()=>{ render('search'); const el=$('#q'); if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);} }, 250); return; }
  if(t.id && t.id.startsWith('f-')){
    const k = t.id.slice(2);
    if(k==='box') S.intakeDraft.boxFolder = t.value;
    else if(k==='name') S.intakeDraft.name = t.value;
    else S.intakeDraft[k] = t.value;
  }
  if(t.name==='jt') S.intakeDraft.type = t.value;
});
$('#scrim').addEventListener('click', closeDrawer);
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') closeDrawer();
  if(!S.drawerId) return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    const list = filtered(), i = list.findIndex(x=>x.id===S.drawerId);
    const j = e.key==='ArrowDown'? i+1 : i-1;
    if(list[j]){ e.preventDefault(); openDrawer(list[j].id); }
  }
});
function submitIntake(){
  const d = S.intakeDraft;
  d.boxFolder = $('#f-box').value; d.name = $('#f-name').value;
  INTAKE_FIELDS.forEach(([k])=>{ const el = $('#f-'+k); if(el) d[k] = el.value; });
  d.filters = $$('#f-filters input:checked').map(i=>i.value);
  const jt = $('#f-type input:checked'); if(jt) d.type = jt.value;
  if(!d.name.trim()){ toast('Give the accession a name so it can be found later'); $('#f-name').focus(); return; }
  if(!d.boxFolder.trim()){ toast('Point the form at a Box folder'); $('#f-box').focus(); return; }
  if(!d.valuable.trim()){ toast('Say what is most valuable to keep — the ranking depends on it'); $('#f-valuable').focus(); return; }

  const intake = {}; INTAKE_FIELDS.forEach(([k])=> intake[k] = d[k]||'');
  intake.boxFolder = d.boxFolder;
  if(d._job){
    const j = jobById(d._job);
    Object.assign(j, { name:d.name, type:d.type, intake, status:'queued' });
    toast(j.id + ' updated and still queued');
  } else {
    const id = 'ACC-2026-0' + (19 + S.jobs.filter(j=>j.id>'ACC-2026-018').length);
    const files = Math.round(between(40,240));
    S.jobs.push({ id, name:d.name, type:d.type, status:'queued', files, sizeKB:files*Math.round(between(400,9000)), intake });
    toast(id + ' submitted for ' + windowLabel());
  }
  S.intakeDraft = null;
  go('queue');
}

/* ---------- init ---------- */
setInterval(()=>{ const c = $('#cd'); if(c) c.textContent = untilStr(nextWindow()); }, 30000);
loadData().then(()=>{ if(S.loadError){ document.querySelector('#main,main,.main,body').insertAdjacentHTML('afterbegin', '<div style="padding:14px 18px;border:1px solid #7B2D26;color:#7B2D26;margin:12px">Could not load prototype-data.json — '+S.loadError+'. Generate it with scripts/export_prototype.py.</div>'); } go('dash'); });

</script>
